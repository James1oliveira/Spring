server.port=0

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.collection-name=board-game-buddy


spring.cloud.function.definition=\
  fileSupplier|\
  documentReader|\
  splitter|\
  titleDeterminer|\
  vectorStoreConsumer


file.supplier.directory=/var/dropoff
file.supplier.filename-regex=.*\.(pdf|docx|txt)

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.temperature=0
